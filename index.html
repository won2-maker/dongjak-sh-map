<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>동작구 SH 임대아파트 답사</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;display:flex;height:100vh;overflow:hidden}
#map{flex:1}
#panel{
  width:280px;flex-shrink:0;background:#fff;display:flex;flex-direction:column;
  border-left:1px solid #dde5ef;overflow:hidden;
}
#ph{padding:14px 16px 11px;border-bottom:1px solid #edf1f6;flex-shrink:0}
#ph h1{font-size:14px;font-weight:700;color:#0b1724;margin-bottom:2px}
#ph p{font-size:11px;color:#92a3b5}
#status{
  padding:8px 16px;background:#fffbeb;border-bottom:1px solid #fde68a;
  font-size:11px;color:#92400e;display:flex;align-items:center;gap:8px;flex-shrink:0;
}
#status.done{background:#f0fdf4;border-color:#86efac;color:#166534}
#status.done::before{content:'✓ ';font-weight:700}
.spin{
  width:14px;height:14px;border:2px solid #fde68a;border-top-color:#d97706;
  border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
#list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#dde5ef transparent}
#list::-webkit-scrollbar{width:3px}
#list::-webkit-scrollbar-thumb{background:#dde5ef;border-radius:2px}
.si{
  display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid #f4f7fb;
  cursor:pointer;transition:background .1s;align-items:flex-start;
}
.si:hover{background:#f8fafd}
.si.act{background:#eff5fd;border-left:3px solid var(--c);padding-left:13px}
.si-num{
  width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:800;
  font-family:'Courier New',monospace;color:#fff;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;background:var(--c);
}
.si-body{flex:1;min-width:0}
.si-name{font-size:12px;font-weight:700;color:#0b1724;line-height:1.3}
.si-sub{font-size:9px;font-weight:400;color:#a0b0c0}
.si-addr{font-size:10px;color:#a0afc0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tg{padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700}
.t50{background:#e6f0fb;color:#2765b0}
.tjt{background:#efe8fb;color:#6830b0}
.thb{background:#e6f9f2;color:#1a7a52}
.tp1{background:rgba(16,217,158,.15);color:#0b8f60}
.tp2{background:rgba(77,158,247,.15);color:#2060c0}
.tp3{background:rgba(245,166,35,.15);color:#a06000}
.si-loading{font-size:9px;color:#aaa;margin-top:4px}
.si-info{font-size:10px;color:#6080a0;margin-top:4px;font-weight:600}
#leg{padding:9px 16px;border-top:1px solid #edf1f6;display:flex;gap:14px;background:#fafbfd;flex-shrink:0}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#7080a0;font-weight:600}
.ld{width:9px;height:9px;border-radius:50%}
/* leaflet popup */
.leaflet-popup-content{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:12px;line-height:1.6;min-width:160px}
.lp-name{font-weight:700;font-size:13px;color:#0b1724;margin-bottom:4px}
.lp-addr{font-size:10px;color:#888;margin-bottom:6px}
.lp-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.lp-btn{
  display:block;text-align:center;padding:5px 0;background:#fee;border-radius:5px;
  color:#d03;font-size:11px;font-weight:700;text-decoration:none;
}
.lp-btn:hover{background:#fcc}
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <div id="ph">
    <h1>동작구 SH 임대아파트 답사</h1>
    <p>12개 단지 · SH공사 · 공유주차 검토</p>
  </div>
  <div id="status"><div class="spin"></div><span id="stxt">주소 좌표 변환 중… (0/12)</span></div>
  <div id="list"></div>
  <div id="leg">
    <div class="leg"><div class="ld" style="background:#10d99e"></div>1순위</div>
    <div class="leg"><div class="ld" style="background:#4d9ef7"></div>2순위</div>
    <div class="leg"><div class="ld" style="background:#f5a623"></div>3순위</div>
  </div>
</div>

<script>
const DATA = [
  { id:1,  name:'상도삼호',                sub:'상도5',    addr:'서울특별시 동작구 상도로 407',         type:'50년임대', pri:1, dongs:5,    units:682,  person:'무파사', rentalDongs:'전체 (5개동)', mixed:false },
  { id:2,  name:'상도건영',                sub:'본동2-2',  addr:'서울특별시 동작구 만양로 26',           type:'50년임대', pri:2, dongs:6,    units:824,  person:'율리안', rentalDongs:'전체 (6개동)', mixed:false },
  { id:3,  name:'상도신동아',              sub:'상도1',    addr:'서울특별시 동작구 만양로 19',           type:'50년임대', pri:2, dongs:null, units:null, person:'율리안', rentalDongs:'전체 (현장확인)', mixed:false },
  { id:4,  name:'상도래미안1차',           sub:'상도2',    addr:'서울특별시 동작구 등용로 37',           type:'50년임대', pri:2, dongs:null, units:517,  person:'율리안', rentalDongs:'전체 (현장확인)', mixed:false },
  { id:5,  name:'상도SH-ville',            sub:'',         addr:'서울특별시 동작구 상도로53길 70',       type:'50년임대', pri:1, dongs:4,    units:953,  person:'무파사', rentalDongs:'전체 (4개동)', mixed:false },
  { id:6,  name:'흑석한강센트레빌',        sub:'흑석5',    addr:'서울특별시 동작구 흑석한강로 12',       type:'50년임대', pri:1, dongs:null, units:655,  person:'무파사', rentalDongs:'전체 (현장확인)', mixed:false },
  { id:7,  name:'래미안트윈파크',          sub:'본동5',    addr:'서울특별시 동작구 노량진로23가길 23',   type:'50년임대', pri:2, dongs:5,    units:523,  person:'무파사', rentalDongs:'104동', mixed:true },
  { id:8,  name:'흑석한강푸르지오',        sub:'흑석4',    addr:'서울특별시 동작구 흑석한강로 27',       type:'50년임대', pri:3, dongs:14,   units:863,  person:'무파사', rentalDongs:'전체 (14개동)', mixed:false },
  { id:9,  name:'상도두산위브트레지움',    sub:'',         addr:'서울특별시 동작구 상도로30길 40',       type:'장기전세', pri:2, dongs:6,    units:582,  person:'율리안', rentalDongs:'현장확인 필요', mixed:true },
  { id:10, name:'상도동효성해링턴플레이스',sub:'',         addr:'서울특별시 동작구 상도로 207',          type:'장기전세', pri:2, dongs:null, units:null, person:'율리안', rentalDongs:'현장확인 필요', mixed:true },
  { id:11, name:'아크로리버하임',          sub:'흑석7',    addr:'서울특별시 동작구 현충로 52',           type:'50년임대', pri:1, dongs:20,   units:null, person:'무파사', rentalDongs:'현장확인 필요 (162세대)', mixed:true },
  { id:12, name:'보라매자이',              sub:'',         addr:'서울특별시 동작구 여의대방로22길 121',  type:'행복주택', pri:1, dongs:8,    units:null, person:'율리안', rentalDongs:'전체 (8개동)', mixed:false },
];

const PERSON_COLOR = { '율리안':'#2b4a8a', '무파사':'#c67c00' };
const PERSON_EMOJI = { '율리안':'🎖', '무파사':'🦁' };

function personImgSrc(person) {
  const col = encodeURIComponent(PERSON_COLOR[person]);
  const em = PERSON_EMOJI[person];
  return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><circle cx="40" cy="40" r="38" fill="${PERSON_COLOR[person]}" stroke="white" stroke-width="4"/><text x="40" y="54" text-anchor="middle" font-size="40" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">${em}</text></svg>`)}`;
}

const C = { 1:'#10d99e', 2:'#4d9ef7', 3:'#f5a623' };
const PRI = { 1:'1순위', 2:'2순위', 3:'3순위' };
const TCLS = { '50년임대':'t50','장기전세':'tjt','행복주택':'thb' };
const PCLS = { 1:'tp1', 2:'tp2', 3:'tp3' };

// Init map centered on Dongjak-gu
const map = L.map('map', {zoomControl:true}).setView([37.502, 126.947], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom:19
}).addTo(map);

const markerMap = {};
let loadedCount = 0;

// Build sidebar items first
const listEl = document.getElementById('list');
DATA.forEach(d => {
  const div = document.createElement('div');
  div.className='si'; div.id=`si${d.id}`;
  div.style.setProperty('--c', C[d.pri]);
  div.innerHTML=`
    <div class="si-num">${d.id}</div>
    <div class="si-body">
      <div class="si-name">
        <span style="font-size:11px;font-weight:800;padding:1px 5px;border-radius:3px;background:${PERSON_COLOR[d.person]};color:#fff;margin-right:5px">${d.person}</span>${d.name}${d.sub?` <span class="si-sub">(${d.sub})</span>`:''}
      </div>
      <div class="si-addr">${d.addr}</div>
      <div class="si-tags">
        <span class="tg ${TCLS[d.type]}">${d.type}</span>
        <span class="tg ${PCLS[d.pri]}">${PRI[d.pri]}</span>
      </div>
      <div class="si-info">
        <span style="color:#888">임대동:</span> <span style="color:${d.mixed?'#c05000':'#1a6a3a'};font-weight:700">${d.rentalDongs}</span>
      </div>
      <div class="si-loading" id="ld${d.id}">좌표 변환 중…</div>
    </div>`;
  div.onclick = () => {
    if(markerMap[d.id]) markerMap[d.id].openPopup();
    selectItem(d.id);
  };
  listEl.appendChild(div);
});

// Nominatim geocode (rate-limited 1/sec)
async function geocode(addr) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(addr)}&format=json&limit=1&countrycodes=kr`;
  try {
    const res = await fetch(url, {headers:{'Accept-Language':'ko'}});
    const data = await res.json();
    if(data.length) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  } catch(e) {}
  return null;
}

function makeIcon(d) {
  const col = C[d.pri];
  const pcol = PERSON_COLOR[d.person];
  const emoji = PERSON_EMOJI[d.person];
  const imgHtml = `<img src="${personImgSrc(d.person)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid ${pcol}"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40">
    <path d="M14 0C6.27 0 0 6.27 0 14c0 9.63 14 26 14 26S28 23.63 28 14C28 6.27 21.73 0 14 0z" fill="${col}"/>
    <circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/>
  </svg>`;
  return L.divIcon({
    className:'',
    html:`<div style="position:relative;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))">
      ${svg}
      <div style="position:absolute;top:-32px;left:50%;transform:translateX(-50%)">${imgHtml}</div>
    </div>`,
    iconSize:[28,72], iconAnchor:[14,72], popupAnchor:[0,-74]
  });
}

function naverUrl(name, addr) {
  return `https://map.naver.com/v5/search/${encodeURIComponent(name + ' ' + addr)}`;
}

async function loadAll() {
  for(const d of DATA) {
    const coords = await geocode(d.addr);
    loadedCount++;
    document.getElementById('stxt').textContent = `주소 좌표 변환 중… (${loadedCount}/12)`;

    const ldEl = document.getElementById(`ld${d.id}`);

    if(coords) {
      const marker = L.marker(coords, {icon: makeIcon(d)}).addTo(map);
      marker.bindPopup(`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <img src="${personImgSrc(d.person)}" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"/>
          <div>
            <div style="font-size:10px;font-weight:800;color:${PERSON_COLOR[d.person]}">${d.person} 담당</div>
            <div class="lp-name" style="margin-bottom:0">${d.name}${d.sub?` <span style="font-size:10px;font-weight:400;color:#999">(${d.sub})</span>`:''}</div>
          </div>
        </div>
        <div class="lp-addr">${d.addr}</div>
        <div class="lp-tags">
          <span class="tg ${TCLS[d.type]}">${d.type}</span>
          <span class="tg ${PCLS[d.pri]}">${PRI[d.pri]}</span>
        </div>
        <div style="font-size:11px;color:#4070b0;font-weight:600;margin-bottom:8px">${d.dongs?`${d.dongs}동`:'동수 미확인'}${d.units?` · ${d.units.toLocaleString()}세대`:''}</div>
        <div style="font-size:10px;color:#555;margin-bottom:6px;padding:5px 7px;background:#f4f7fb;border-radius:4px;line-height:1.6">
          <b style="color:#222">임대동</b><br>
          <span style="color:${d.mixed?'#c05000':'#1a6a3a'}">${d.rentalDongs}</span>
          ${d.mixed?'<span style="font-size:9px;color:#e07000;margin-left:3px">(혼합단지)</span>':''}
        </div>
        <a class="lp-btn" href="${naverUrl(d.name, d.addr)}" target="_blank" style="background:#03c75a;color:#fff">네이버 지도에서 보기</a>
      `);
      marker.on('click', () => selectItem(d.id));
      markerMap[d.id] = marker;
      if(ldEl) ldEl.remove();
    } else {
      if(ldEl) { ldEl.textContent='좌표 변환 실패'; ldEl.style.color='#e00'; }
    }

    if(loadedCount < 12) await new Promise(r => setTimeout(r, 1100)); // Nominatim 1req/sec
  }

  const st = document.getElementById('status');
  st.className='done';
  st.innerHTML='12개 단지 모두 표시 완료';

  // Fit map to all markers
  const coords = Object.values(markerMap).map(m => m.getLatLng());
  if(coords.length > 1) map.fitBounds(L.latLngBounds(coords), {padding:[40,40]});
}

function selectItem(id) {
  document.querySelectorAll('.si').forEach(e => e.classList.remove('act'));
  const el = document.getElementById(`si${id}`);
  if(el) { el.classList.add('act'); el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}

loadAll();
</script>
</body>
</html>
